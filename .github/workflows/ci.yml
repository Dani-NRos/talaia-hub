# On every push: the tests (Node 22 and 24, with a real Mosquitto), the screen's build, and the Docker image, built
# for amd64 and arm64 and tried end to end with docker/compose.yaml. The release workflow runs this first too.
name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: codigo/package-lock.json
      - name: Mosquitto, for the tests of this machine's broker
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mosquitto
          sudo systemctl stop mosquitto || true
          # The runner's AppArmor keeps Mosquitto in its own folders; the tests run it with their files in /tmp.
          perfiles="$(grep -l -s -E 'mosquitto' /etc/apparmor.d/* || true)"
          echo "::notice title=AppArmor and Mosquitto::profiles: ${perfiles:-none}; loaded: $(sudo aa-status 2>/dev/null | grep -i mosquitto | xargs)"
          for f in $perfiles; do sudo apparmor_parser -R "$f" || true; done
      - run: npm ci --no-audit --no-fund
        working-directory: codigo
      - run: npm test
        working-directory: codigo
      - name: What failed, as annotations on the run
        if: failure()
        working-directory: codigo
        run: |
          for w in nucleo app servidor; do
            (cd "$w" && node --test --test-force-exit --test-reporter=tap test/*.test.mjs > "/tmp/$w.tap" 2>&1) && continue
            msg="$(grep -E -A25 '^ *not ok' "/tmp/$w.tap" | head -c 6000 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN{ORS="%0A"} {print}')"
            echo "::error title=Tests of ${w} (Node ${{ matrix.node }})::${msg}"
          done
      - run: npm run build
        working-directory: codigo

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: codigo/package-lock.json
      - name: What the end-to-end test needs (the simulated node, MQTT)
        run: npm ci --no-audit --no-fund
        working-directory: codigo
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Image for amd64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: talaia-hub:prueba
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: End to end with compose (Talaia, its Mosquitto and a simulated node)
        run: node codigo/herramientas/docker-prueba.mjs talaia-hub:prueba
      - name: Image for arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: talaia-hub:prueba-arm64
          cache-from: type=gha
      - name: The arm64 image starts and loads its serial port library
        run: |
          docker run --rm --platform linux/arm64 talaia-hub:prueba-arm64 --version
          docker run --rm --platform linux/arm64 --entrypoint node -w /opt/talaia/servidor talaia-hub:prueba-arm64 \
            -e "require('@serialport/bindings-cpp'); console.log('serialport: ok')"
