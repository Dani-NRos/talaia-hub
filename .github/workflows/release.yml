# A release made on GitHub (tag vX.Y.Z, the same version as codigo/package.json) publishes the Docker image on
# ghcr.io/dani-nros/talaia-hub for amd64 and arm64, tagged X.Y.Z, X.Y, X and latest (a pre-release, only X.Y.Z-…),
# after the same tests as CI.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: The release's version is the program's
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./codigo/package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "::error::The release is ${GITHUB_REF_NAME}, but codigo/package.json says ${version}"
            exit 1
          fi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dani-nros/talaia-hub
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
