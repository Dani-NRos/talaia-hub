<title>Talaia</title>
<style>/*@CSS@*/</style>
<div class="shell">
<nav class="nav" id="nav"></nav>
<div class="stage">
  <header class="top">
    <a class="top-mark" href="#/dashboard" id="topMark"></a>
    <h1 class="top-t" id="topTitle"></h1>
    <button id="linkBtn" class="link" type="button" data-state="connecting"><span class="ld"></span><span class="lt"></span></button>
    <a class="icon-btn gear-m" href="#/settings" id="gearBtn"></a>
  </header>

  <main>
    <div class="view" id="v-dashboard" data-view="dashboard">
      <section id="board" aria-live="polite"></section>
      <section class="sec" aria-labelledby="h-watch">
        <div class="sec-h has-tools"><h2 id="h-watch">Paneles</h2><span id="watchCount" class="count"></span><div class="sec-tools" id="cardTools" hidden></div></div>
        <div id="cards" class="cards"></div>
      </section>
    </div>

    <div class="view" id="v-alarms" data-view="alarms" hidden>
      <section id="alarmBoard" aria-live="polite"></section>
      <section class="sec" aria-labelledby="h-log">
        <div class="sec-h"><h2 id="h-log">Registro</h2></div>
        <ol id="log" class="log"></ol>
        <button id="logMore" class="more" type="button" hidden>Ver todo el registro</button>
      </section>
    </div>

    <div class="view" id="v-nodes" data-view="nodes" hidden>
      <section class="sec" aria-labelledby="h-mesh">
        <div class="sec-h"><h2 id="h-mesh">Resto de la malla</h2><span id="meshCount" class="count"></span></div>
        <div class="mesh-tools" id="meshTools" hidden>
          <div class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><input id="meshQ" class="inp" type="search" placeholder="Buscar por nombre, ID o modelo" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="Buscar nodos por nombre, ID o modelo" aria-controls="mesh"><kbd class="search-k" aria-hidden="true">/</kbd></div>
          <div class="mesh-f"><label class="vh" for="meshSort">Ordenar</label><select id="meshSort" class="inp sel"></select><div class="fchips" id="meshFilters" role="group" aria-label="Filtros"></div></div>
        </div>
        <ul id="mesh" class="mesh" aria-live="polite" aria-relevant="additions removals"></ul>
        <button id="meshMore" class="more" type="button" hidden>Ver todos</button>
      </section>
    </div>

    <div class="view view-map" id="v-map" data-view="map" hidden>
      <div class="map-h">
        <span id="mapCount" class="count"></span>
        <div class="map-f">
          <label class="vh" for="mapMetric">Sensor</label><select id="mapMetric" class="inp sel"></select>
          <label class="vh" for="mapAge">Antigüedad</label><select id="mapAge" class="inp sel"></select>
        </div>
      </div>
      <div id="mapBox"></div>
    </div>

    <div class="view" id="v-automations" data-view="automations" hidden>
      <div class="soon" id="soon"></div>
    </div>

    <div class="view view-narrow" id="v-settings" data-view="settings" hidden>
      <div id="settings"></div>
    </div>
  </main>
</div>
</div>

<dialog id="detail" class="sheet" aria-label="Ficha del nodo"></dialog>
<dialog id="nodeview" class="full nv" aria-label="Nodo a pantalla completa"></dialog>
<div id="gate" class="gate" hidden></div>
<div id="toast" role="status" hidden></div>
<!--APP-->
