# Talaia: el broker MQTT de casa (lo pone el instalador de Talaia en /etc/mosquitto/conf.d/talaia.conf).
# Escucha en la red de casa y solo deja entrar con usuario y contraseña. Los usuarios se crean y se cambian desde
# Talaia (Ajustes → MQTT → Broker de este servidor); el servicio talaia-mosquitto los copia a talaia.passwd y recarga
# Mosquitto.
listener 1883
allow_anonymous false
password_file /etc/mosquitto/talaia.passwd
