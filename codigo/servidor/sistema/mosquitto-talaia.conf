# Talaia: el broker MQTT de casa (lo pone el instalador de Talaia en /etc/mosquitto/conf.d/talaia.conf).
# Escucha en la red de casa y solo deja entrar con usuario y contraseña. Los usuarios se crean y se cambian desde
# Talaia (Ajustes → MQTT → Broker de este servidor), que se los pide al plugin de seguridad dinámica de Mosquitto;
# Mosquitto los guarda (con la contraseña cifrada) en el fichero de plugin_opt_config_file.
listener 1883
allow_anonymous false
plugin @PLUGIN@
plugin_opt_config_file /var/lib/mosquitto/talaia-dynamic-security.json
