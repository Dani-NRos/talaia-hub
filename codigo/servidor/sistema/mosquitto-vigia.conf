# Vigía servidor: el broker MQTT de casa (lo pone el instalador de Vigía en /etc/mosquitto/conf.d/vigia.conf).
# Escucha en la red de casa y solo deja entrar con usuario y contraseña. Los usuarios se crean y se cambian desde
# Vigía (Ajustes → MQTT → Broker de este servidor); el servicio vigia-mosquitto los copia a vigia.passwd y recarga
# Mosquitto.
listener 1883
allow_anonymous false
password_file /etc/mosquitto/vigia.passwd
