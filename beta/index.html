<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e9eeec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1513" media="(prefers-color-scheme: dark)">
<meta name="description" content="Panel de telemetría y alarmas para nodos Meshtastic por Bluetooth, sin internet.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Vigía Mesh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Panel de vigilancia para un móvil apoyado junto al receptor: una columna en el teléfono,
   rejilla de tarjetas en pantallas anchas. Lecturas grandes como un instrumento de campo. */
:root {
  --bg: #e9eeec;
  --surface: #fbfcfb;
  --surface-2: #e1e8e5;
  --ink: #152320;
  --ink-2: #4f625d;
  --line: #c6d2ce;
  --accent: #1d6a86;
  --on-accent: #ffffff;
  --ok: #2b7a4b;
  --warn: #a8640a;
  --crit: #c0362c;
  --on-crit: #fff7f5;
  --off: #66638a;
  --shadow: 0 1px 2px rgb(21 35 32 / .06), 0 6px 18px -10px rgb(21 35 32 / .18);
  --f-display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif-condensed, sans-serif;
  --f-body: "Barlow", "Segoe UI", Roboto, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513; --surface: #151e1c; --surface-2: #1d2926; --ink: #e2ebe8; --ink-2: #93a6a1; --line: #2a3936;
    --accent: #5fb6d4; --on-accent: #062029; --ok: #5cc287; --warn: #e4a443; --crit: #ff6a5c; --on-crit: #2a0503; --off: #a9a6d0;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 22px -12px rgb(0 0 0 / .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #151e1c; --surface-2: #1d2926; --ink: #e2ebe8; --ink-2: #93a6a1; --line: #2a3936;
  --accent: #5fb6d4; --on-accent: #062029; --ok: #5cc287; --warn: #e4a443; --crit: #ff6a5c; --on-crit: #2a0503; --off: #a9a6d0;
  --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 8px 22px -12px rgb(0 0 0 / .6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in oklab, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 8px; margin-right: auto; min-width: 0; }
.brand svg { width: 28px; height: 28px; flex: none; color: var(--accent); }
.brand h1 { font: 700 23px/1 var(--f-display); letter-spacing: .01em; white-space: nowrap; }
.brand h1 span { font-weight: 500; color: var(--ink-2); }
.link { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 13px 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font: 600 14px/1 var(--f-body); white-space: nowrap; max-width: 58vw; }
.link svg { width: 17px; height: 17px; flex: none; }
.link .lt { overflow: hidden; text-overflow: ellipsis; }
.link .ld { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-2); flex: none; }
.link[data-state="ready"] .ld { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in oklab, var(--ok) 25%, transparent); }
.link[data-state="reconnecting"] .ld, .link[data-state="connecting"] .ld, .link[data-state="configuring"] .ld { background: var(--warn); animation: blink 1.1s steps(2) infinite; }
.link[data-state="idle"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.link[data-state="idle"] .ld { display: none; }
.link[data-state="demo"] { border-style: dashed; }
.link[data-state="demo"] .ld { background: var(--accent); }
.icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; flex: none; }
.icon-btn svg { width: 20px; height: 20px; }

/* aviso de demo */
.demo-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 14px; padding: 10px 14px; border: 1px dashed var(--accent); border-radius: 12px; background: color-mix(in oklab, var(--accent) 8%, var(--surface)); }
.demo-bar p { flex: 1 1 220px; font-size: 14px; }
.demo-bar strong { font-weight: 600; }

/* tablero de estado */
#board { display: grid; gap: 10px; margin-top: 14px; }
.board { border-radius: var(--r); padding: 14px 16px; }
.board h2 { font: 700 22px/1.1 var(--f-display); text-transform: uppercase; letter-spacing: .03em; }
.board.crit { background: var(--crit); color: var(--on-crit); box-shadow: var(--shadow); }
.board.seen { background: color-mix(in oklab, var(--warn) 14%, var(--surface)); border: 1px solid color-mix(in oklab, var(--warn) 55%, var(--line)); }
.board.calm { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); }
.board.calm h2 { font-size: 20px; }
.board.calm p { color: var(--ink-2); font-size: 14px; }
.calm-dot { width: 14px; height: 14px; border-radius: 50%; background: var(--ok); flex: none; box-shadow: 0 0 0 0 color-mix(in oklab, var(--ok) 50%, transparent); animation: breathe 3.2s ease-out infinite; }
.board-h { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; }
.al-list { list-style: none; margin: 10px 0 0; padding: 0; display: grid; }
.al { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 10px 0; border-top: 1px solid color-mix(in oklab, currentColor 22%, transparent); }
.al-main { flex: 1 1 240px; min-width: 0; display: grid; gap: 2px; cursor: pointer; }
.al-main:not([data-open]) { cursor: default; }
.al-main strong { font-weight: 600; font-size: 16px; }
.al-main span { font-size: 14px; opacity: .88; }
.al-side { display: flex; align-items: center; gap: 12px; margin-left: auto; }
.al-t { font: 400 12px/1.2 var(--f-mono); opacity: .8; white-space: nowrap; }
.al-ok { font: 500 12px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
.al.acked { opacity: .82; }
.board.seen .al { border-top-color: color-mix(in oklab, var(--warn) 30%, transparent); }
.notice { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 12px 14px; border-radius: 12px; border: 1px dashed var(--line); background: var(--surface); }
.notice p { flex: 1 1 240px; font-size: 14px; color: var(--ink-2); }

/* guía cuando no conecta */
.trouble { display: grid; gap: 10px; padding: 14px 16px; border-radius: var(--r); background: color-mix(in oklab, var(--warn) 9%, var(--surface)); border: 1px solid color-mix(in oklab, var(--warn) 50%, var(--line)); }
.trouble h2 { font: 700 20px/1.15 var(--f-display); text-transform: uppercase; letter-spacing: .03em; color: var(--warn); }
.trouble p { font-size: 14px; max-width: 70ch; }
.trouble .tr-n { color: var(--ink-2); font: 400 12px/1.3 var(--f-mono); }
.trouble ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 14px; max-width: 70ch; }
.diag { margin: 0; max-height: 240px; overflow: auto; padding: 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); font: 400 11.5px/1.5 var(--f-mono); white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink-2); }
.tips summary { cursor: pointer; font-weight: 600; color: var(--accent); padding: 4px 0; }
.tips ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 13.5px; color: var(--ink-2); }
.tips strong { color: var(--ink); }

/* botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.ghost { background: transparent; }
.btn.on-dark { background: transparent; border-color: color-mix(in oklab, currentColor 55%, transparent); color: inherit; }
.board.seen .btn.on-dark { border-color: color-mix(in oklab, var(--warn) 60%, transparent); }
.btn.danger-ghost { background: transparent; border-color: color-mix(in oklab, var(--crit) 50%, var(--line)); color: var(--crit); }
.btn:hover { filter: brightness(1.05); }
.btn:active { transform: translateY(1px); }

/* secciones */
.sec { margin-top: 26px; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.sec-h h2 { font: 600 15px/1 var(--f-body); text-transform: uppercase; letter-spacing: .09em; color: var(--ink-2); }
.count { font: 500 12px/1 var(--f-mono); color: var(--ink-2); padding: 3px 7px; border: 1px solid var(--line); border-radius: 999px; }
.count:empty { display: none; }

/* tarjetas de sensores */
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); align-items: start; }
.card { container-type: inline-size; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px 12px; display: grid; gap: 12px; cursor: pointer; box-shadow: var(--shadow); min-width: 0; transition: border-color .2s; }
.card:hover { border-color: color-mix(in oklab, var(--accent) 45%, var(--line)); }
.card.st-crit { border-color: var(--crit); box-shadow: 0 0 0 1px var(--crit), var(--shadow); }
.card.st-off .rds, .card.st-off .spark-wrap { opacity: .55; }
.card-h { display: flex; align-items: flex-start; gap: 10px; }
.card-t { flex: 1; min-width: 0; }
.card-t h3 { font: 600 17px/1.2 var(--f-body); overflow-wrap: anywhere; }
.meta { font: 400 12px/1.4 var(--f-mono); color: var(--ink-2); }
.tag { font: 500 12px/1 var(--f-mono); letter-spacing: .06em; padding: 5px 6px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); flex: none; text-transform: uppercase; }
.tag.sm { font-size: 11px; padding: 4px 5px; min-width: 42px; text-align: center; }
.pill { font: 600 11px/1 var(--f-body); text-transform: uppercase; letter-spacing: .08em; padding: 6px 8px; border-radius: 999px; flex: none; white-space: nowrap; }
.p-ok { color: var(--ok); background: color-mix(in oklab, var(--ok) 14%, transparent); }
.p-crit { color: var(--on-crit); background: var(--crit); }
.p-off { color: var(--off); background: color-mix(in oklab, var(--off) 16%, transparent); }
.p-none { color: var(--ink-2); background: var(--surface-2); }
.rds { display: grid; gap: 10px 12px; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); }
.rd { display: grid; gap: 1px; min-width: 0; }
.rd-l { font: 600 11px/1.2 var(--f-body); text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); }
.rd-v { font: 600 34px/1 var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.rd-v small { font: 500 15px/1 var(--f-display); color: var(--ink-2); margin-left: 3px; }
.rd-lim { font: 400 11px/1.2 var(--f-mono); color: var(--ink-2); }
.rd.bad .rd-v { color: var(--crit); }
.rd.bad .rd-lim { color: var(--crit); }
.no-rd { font-size: 14px; color: var(--ink-2); }
.spark-wrap { display: grid; gap: 4px; padding-top: 8px; border-top: 1px dashed var(--line); }
.spark-cap { font: 400 11px/1 var(--f-mono); color: var(--ink-2); }
.spark { position: relative; height: 46px; }
.spark svg { display: block; width: 100%; height: 100%; overflow: visible; }
.spark .ar { fill: color-mix(in oklab, var(--accent) 16%, transparent); }
.spark .ln { fill: none; stroke: var(--accent); stroke-width: 1.7; stroke-linejoin: round; stroke-linecap: round; }
.spark .thr { stroke: var(--crit); stroke-width: 1; stroke-dasharray: 4 4; opacity: .75; }
.spark-dot { position: absolute; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px color-mix(in oklab, var(--accent) 25%, transparent); }
.spark-dot.bad { background: var(--crit); box-shadow: 0 0 0 3px color-mix(in oklab, var(--crit) 28%, transparent); }
.spark-empty { display: grid; place-items: center; border-radius: 8px; background: var(--surface-2); font: 400 12px/1 var(--f-mono); color: var(--ink-2); }
.name-btn { all: unset; cursor: pointer; overflow-wrap: anywhere; }
.name-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* pedir telemetría */
.ask { display: grid; gap: 7px; padding-top: 10px; border-top: 1px solid var(--line); cursor: default; }
.ask.in-sheet { padding-top: 0; border-top: 0; container-type: inline-size; }
.ask.in-sheet .ask-l { display: none; }
.ask-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
@container (max-width: 400px) { .ask-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ask-l { font: 400 11px/1 var(--f-mono); color: var(--ink-2); }
.ask-b { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 600 13px/1 var(--f-body); cursor: pointer; }
.ask-b:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.ask-b:disabled { opacity: .45; cursor: not-allowed; }
.ask-b.is-wait { opacity: 1; border-color: var(--accent); color: var(--accent); cursor: progress; }
.ask-b.is-wait::before { content: ""; width: 9px; height: 9px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
.ask-b.is-ok::before, .ask-b.is-fail::before { content: ""; width: 7px; height: 7px; border-radius: 50%; }
.ask-b.is-ok::before { background: var(--ok); }
.ask-b.is-fail::before { background: var(--warn); }
.key-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; font-size: 13px; color: var(--ink-2); }
.key-row span { flex: 1 1 180px; min-width: 0; }
.key-row.need { color: var(--warn); font-weight: 600; padding: 8px 10px; border-radius: 10px; background: color-mix(in oklab, var(--warn) 10%, transparent); border: 1px solid color-mix(in oklab, var(--warn) 40%, var(--line)); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.chip.warn { color: var(--warn); border-color: color-mix(in oklab, var(--warn) 50%, transparent); }
.ask-st { display: grid; gap: 3px; font: 400 12px/1.35 var(--f-mono); color: var(--ink-2); }
.ask-st:empty { display: none; }
.ask-st .s-wait { color: var(--accent); }
.ask-st .s-ok { color: var(--ok); }
.ask-st .s-fail { color: var(--warn); }

/* ubicación y valla */
.pos { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line); cursor: default; }
.pos.in-sheet { padding-top: 0; border-top: 0; gap: 8px; }
.pos-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.pos-l { font: 400 11px/1 var(--f-mono); color: var(--ink-2); }
.in-sheet .pos-l { font: 600 13px/1 var(--f-body); text-transform: uppercase; letter-spacing: .09em; }
.pos-m { font: 400 11px/1.3 var(--f-mono); color: var(--ink-2); text-align: right; }
.pos-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.pos-c { font: 500 16px/1.2 var(--f-mono); font-variant-numeric: tabular-nums; user-select: all; overflow-wrap: anywhere; }
.mini { display: inline-flex; align-items: center; min-height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--accent); font: 600 12.5px/1 var(--f-body); text-decoration: none; cursor: pointer; white-space: nowrap; }
.mini:hover:not(:disabled) { border-color: var(--accent); }
.mini:disabled { opacity: .45; cursor: not-allowed; }
.fence { margin: 0; font: 500 13px/1.35 var(--f-body); padding: 6px 9px; border-radius: 8px; }
.fence.ok { color: var(--ok); background: color-mix(in oklab, var(--ok) 10%, transparent); }
.fence.warn { color: var(--warn); background: color-mix(in oklab, var(--warn) 12%, transparent); }
.fence.bad { color: var(--on-crit); background: var(--crit); font-weight: 600; }
.fence-box { display: grid; gap: 8px; margin-top: 4px; padding-top: 12px; border-top: 1px dashed var(--line); }
.fence-box h4 { margin: 0; font: 600 13px/1 var(--f-body); text-transform: uppercase; letter-spacing: .09em; color: var(--ink-2); }
.fence-box .warn-t { font-size: 13px; font-weight: 500; }

.empty { padding: 18px; border: 1px dashed var(--line); border-radius: var(--r); background: var(--surface); }
.empty p { max-width: 60ch; color: var(--ink-2); }
.empty strong { color: var(--ink); }

/* resto de la malla */
.mesh { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.row { display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 8px; }
.row + .row { border-top: 1px solid var(--line); }
.row-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px; text-align: left; cursor: pointer; border-radius: 8px; }
.row-t { display: grid; min-width: 0; }
.row-n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { font: 500 10px/1 var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--accent); border: 1px solid color-mix(in oklab, var(--accent) 45%, transparent); padding: 3px 5px; border-radius: 5px; margin-left: 6px; vertical-align: 2px; }
.row .btn { min-height: 36px; padding: 0 12px; }
.empty-row { padding: 14px; color: var(--ink-2); font-size: 14px; list-style: none; }
.more { margin-top: 8px; background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 6px 0; }

/* registro */
.log { list-style: none; margin: 0; padding: 0; display: grid; }
.lg { display: grid; grid-template-columns: 9px auto 1fr; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
.lg::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ink-2); transform: translateY(-1px); }
.lg-raise::before { background: var(--crit); }
.lg-clear::before { background: var(--ok); }
.lg-info::before { background: var(--accent); }
.lg-ack::before { background: var(--line); }
.lg time { font: 400 12px/1 var(--f-mono); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.lg span { min-width: 0; overflow-wrap: anywhere; }
.foot { margin: 28px 0 32px; display: grid; gap: 6px; font: 400 12px/1.5 var(--f-mono); color: var(--ink-2); }
.foot-id a, .about a:not(.btn) { color: var(--accent); text-underline-offset: 3px; }
.foot-id a { display: inline-block; padding: 6px 0; }
a.btn { color: inherit; text-decoration: none; }

/* hojas (detalle y ajustes) */
dialog.sheet { border: 0; padding: 0; width: min(660px, 100%); max-width: 100%; max-height: min(92dvh, 940px); margin: auto auto 0; border-radius: 18px 18px 0 0; background: var(--surface); color: var(--ink); box-shadow: 0 -10px 40px rgb(0 0 0 / .25); overflow: hidden; }
dialog.sheet[open] { display: flex; flex-direction: column; animation: up .22s ease-out; }
dialog::backdrop { background: rgb(8 14 12 / .5); }
@media (min-width: 760px) { dialog.sheet { margin: auto; border-radius: 18px; } }
.sheet-h { display: flex; align-items: flex-start; gap: 12px; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); }
.sheet-t { flex: 1; min-width: 0; }
.sheet-t h2 { font: 700 24px/1.1 var(--f-display); letter-spacing: .01em; overflow-wrap: anywhere; }
.sheet-t .meta { margin-top: 4px; }

\r
.leaflet-pane,\r
.leaflet-tile,\r
.leaflet-marker-icon,\r
.leaflet-marker-shadow,\r

.leaflet-pane > svg,\r
.leaflet-pane > canvas,\r
.leaflet-zoom-box,\r
.leaflet-image-layer,\r
.leaflet-layer {\r
	position: absolute;\r
	left: 0;\r
	top: 0;\r
	}\r
.leaflet-container {\r
	overflow: hidden;\r
	}\r
.leaflet-tile,\r
.leaflet-marker-icon,\r
.leaflet-marker-shadow {\r
	-webkit-user-select: none;\r
	   -moz-user-select: none;\r
	        user-select: none;\r
	  -webkit-user-drag: none;\r
	}\r
/* Prevents IE11 from highlighting tiles in blue */\r
.leaflet-tile::selection {\r
	background: transparent;\r
}\r
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */\r
.leaflet-safari .leaflet-tile {\r
	image-rendering: -webkit-optimize-contrast;\r
	}\r
/* hack that prevents hw layers "stretching" when loading new tiles */\r
.leaflet-safari .leaflet-tile-container {\r
	width: 1600px;\r
	height: 1600px;\r
	-webkit-transform-origin: 0 0;\r
	}\r
.leaflet-marker-icon,\r
.leaflet-marker-shadow {\r
	display: block;\r
	}\r
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */\r

.leaflet-container .leaflet-overlay-pane svg {\r

	max-height: none !important;\r
	}\r
.leaflet-container .leaflet-marker-pane img,\r
.leaflet-container .leaflet-shadow-pane img,\r
.leaflet-container .leaflet-tile-pane img,\r
.leaflet-container img.leaflet-image-layer,\r
.leaflet-container .leaflet-tile {\r
	max-width: none !important;\r
	max-height: none !important;\r
	width: auto;\r
	padding: 0;\r
	}\r
\r
.leaflet-container img.leaflet-tile {\r
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */\r
	mix-blend-mode: plus-lighter;\r
}\r
\r
.leaflet-container.leaflet-touch-zoom {\r
	-ms-touch-action: pan-x pan-y;\r
	touch-action: pan-x pan-y;\r
	}\r
.leaflet-container.leaflet-touch-drag {\r
	-ms-touch-action: pinch-zoom;\r
	/* Fallback for FF which doesn't support pinch-zoom */\r
	touch-action: none;\r
	touch-action: pinch-zoom;\r
}\r
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {\r
	-ms-touch-action: none;\r
	touch-action: none;\r
}\r
.leaflet-container {\r
	-webkit-tap-highlight-color: transparent;\r
}\r
.leaflet-container a {\r
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);\r
}\r
.leaflet-tile {\r
	filter: inherit;\r
	visibility: hidden;\r
	}\r
.leaflet-tile-loaded {\r
	visibility: inherit;\r
	}\r
.leaflet-zoom-box {\r
	width: 0;\r
	height: 0;\r
	-moz-box-sizing: border-box;\r
	     box-sizing: border-box;\r
	z-index: 800;\r
	}\r
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */\r
.leaflet-overlay-pane svg {\r
	-moz-user-select: none;\r
	}\r
\r
.leaflet-pane         { z-index: 400; }\r
\r
.leaflet-tile-pane    { z-index: 200; }\r
.leaflet-overlay-pane { z-index: 400; }\r
.leaflet-shadow-pane  { z-index: 500; }\r
.leaflet-marker-pane  { z-index: 600; }\r
.leaflet-tooltip-pane   { z-index: 650; }\r
.leaflet-popup-pane   { z-index: 700; }\r

	height: 1px;\r
	}\r

	position: absolute;\r
	}\r

	}\r

/* cursors */\r
\r
.leaflet-interactive {\r
	cursor: pointer;\r
	}\r
.leaflet-grab {\r
	cursor: -webkit-grab;\r
	cursor:    -moz-grab;\r
	cursor:         grab;\r
	}\r
.leaflet-crosshair,\r
.leaflet-crosshair .leaflet-interactive {\r
	cursor: crosshair;\r
	}\r
.leaflet-popup-pane,\r
.leaflet-control {\r
	cursor: auto;\r
	}\r
.leaflet-dragging .leaflet-grab,\r
.leaflet-dragging .leaflet-grab .leaflet-interactive,\r
.leaflet-dragging .leaflet-marker-draggable {\r
	cursor: move;\r
	cursor: -webkit-grabbing;\r
	cursor:    -moz-grabbing;\r
	cursor:         grabbing;\r
	}\r
\r
/* marker & overlays interactivity */\r
.leaflet-marker-icon,\r
.leaflet-marker-shadow,\r
.leaflet-image-layer,\r
.leaflet-pane > svg path,\r
.leaflet-tile-container {\r
	pointer-events: none;\r
	}\r
\r
.leaflet-marker-icon.leaflet-interactive,\r
.leaflet-image-layer.leaflet-interactive,\r
.leaflet-pane > svg path.leaflet-interactive,\r
svg.leaflet-image-layer.leaflet-interactive path {\r
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */\r
	pointer-events: auto;\r
	}\r
\r
/* visual tweaks */\r
\r
.leaflet-container {\r
	background: #ddd;\r
	outline-offset: 1px;\r
	}\r
.leaflet-container a {\r
	color: #0078A8;\r
	}\r
.leaflet-zoom-box {\r
	border: 2px dotted #38f;\r
	background: rgba(255,255,255,0.5);\r
	}\r
\r
\r
/* general typography */\r
.leaflet-container {\r
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;\r
	font-size: 12px;\r
	font-size: 0.75rem;\r
	line-height: 1.5;\r
	}\r
\r
\r
/* general toolbar styles */\r
\r
.leaflet-bar {\r
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);\r
	border-radius: 4px;\r
	}\r
.leaflet-bar a {\r
	background-color: #fff;\r
	border-bottom: 1px solid #ccc;\r
	width: 26px;\r
	height: 26px;\r
	line-height: 26px;\r
	display: block;\r
	text-align: center;\r
	text-decoration: none;\r
	color: black;\r
	}\r
.leaflet-bar a,\r
.leaflet-control-layers-toggle {\r
	background-position: 50% 50%;\r
	background-repeat: no-repeat;\r
	display: block;\r
	}\r
.leaflet-bar a:hover,\r
.leaflet-bar a:focus {\r
	background-color: #f4f4f4;\r
	}\r
.leaflet-bar a:first-child {\r
	border-top-left-radius: 4px;\r
	border-top-right-radius: 4px;\r
	}\r
.leaflet-bar a:last-child {\r
	border-bottom-left-radius: 4px;\r
	border-bottom-right-radius: 4px;\r
	border-bottom: none;\r
	}\r
.leaflet-bar a.leaflet-disabled {\r
	cursor: default;\r
	background-color: #f4f4f4;\r
	color: #bbb;\r
	}\r
\r
.leaflet-touch .leaflet-bar a {\r
	width: 30px;\r
	height: 30px;\r
	line-height: 30px;\r
	}\r
.leaflet-touch .leaflet-bar a:first-child {\r
	border-top-left-radius: 2px;\r
	border-top-right-radius: 2px;\r
	}\r
.leaflet-touch .leaflet-bar a:last-child {\r
	border-bottom-left-radius: 2px;\r
	border-bottom-right-radius: 2px;\r
	}\r
\r
/* zoom control */\r
\r
.leaflet-control-zoom-in,\r
.leaflet-control-zoom-out {\r
	font: bold 18px 'Lucida Console', Monaco, monospace;\r
	text-indent: 1px;\r
	}\r
\r
.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {\r
	font-size: 22px;\r
	}\r
\r
\r
/* layers control */\r
\r
.leaflet-control-layers {\r
	box-shadow: 0 1px 5px rgba(0,0,0,0.4);\r
	background: #fff;\r
	border-radius: 5px;\r
	}\r
.leaflet-control-layers-toggle {\r
	background-image: url(images/layers.png);\r
	width: 36px;\r
	height: 36px;\r
	}\r
.leaflet-retina .leaflet-control-layers-toggle {\r
	background-image: url(images/layers-2x.png);\r
	background-size: 26px 26px;\r
	}\r
.leaflet-touch .leaflet-control-layers-toggle {\r
	width: 44px;\r
	height: 44px;\r
	}\r
.leaflet-control-layers .leaflet-control-layers-list,\r
.leaflet-control-layers-expanded .leaflet-control-layers-toggle {\r
	display: none;\r
	}\r
.leaflet-control-layers-expanded .leaflet-control-layers-list {\r
	display: block;\r
	position: relative;\r
	}\r
.leaflet-control-layers-expanded {\r
	padding: 6px 10px 6px 6px;\r
	color: #333;\r
	background: #fff;\r
	}\r
.leaflet-control-layers-scrollbar {\r
	overflow-y: scroll;\r
	overflow-x: hidden;\r
	padding-right: 5px;\r
	}\r
.leaflet-control-layers-selector {\r
	margin-top: 2px;\r
	position: relative;\r
	top: 1px;\r
	}\r
.leaflet-control-layers label {\r
	display: block;\r
	font-size: 13px;\r
	font-size: 1.08333em;\r
	}\r
.leaflet-control-layers-separator {\r
	height: 0;\r
	border-top: 1px solid #ddd;\r
	margin: 5px -10px 5px -6px;\r
	}\r
\r
/* Default icon URLs */\r
.leaflet-default-icon-path { /* used only in path-guessing heuristic, see L.Icon.Default */\r
	background-image: url(images/marker-icon.png);\r
	}\r
\r
\r
/* attribution and scale controls */\r
\r
.leaflet-container .leaflet-control-attribution {\r
	background: #fff;\r
	background: rgba(255, 255, 255, 0.8);\r
	margin: 0;\r
	}\r
.leaflet-control-attribution,\r
.leaflet-control-scale-line {\r
	padding: 0 5px;\r
	color: #333;\r
	line-height: 1.4;\r
	}\r
.leaflet-control-attribution a {\r
	text-decoration: none;\r
	}\r
.leaflet-control-attribution a:hover,\r
.leaflet-control-attribution a:focus {\r
	text-decoration: underline;\r
	}\r
.leaflet-attribution-flag {\r
	display: inline !important;\r
	vertical-align: baseline !important;\r
	width: 1em;\r
	height: 0.6669em;\r
	}\r
.leaflet-left .leaflet-control-scale {\r
	margin-left: 5px;\r
	}\r
.leaflet-bottom .leaflet-control-scale {\r
	margin-bottom: 5px;\r
	}\r
.leaflet-control-scale-line {\r
	border: 2px solid #777;\r
	border-top: none;\r
	line-height: 1.1;\r
	padding: 2px 5px 1px;\r
	white-space: nowrap;\r
	-moz-box-sizing: border-box;\r
	     box-sizing: border-box;\r
	background: rgba(255, 255, 255, 0.8);\r
	text-shadow: 1px 1px #fff;\r
	}\r
.leaflet-control-scale-line:not(:first-child) {\r
	border-top: 2px solid #777;\r
	border-bottom: none;\r
	margin-top: -2px;\r
	}\r
.leaflet-control-scale-line:not(:first-child):not(:last-child) {\r
	border-bottom: 2px solid #777;\r
	}\r
\r
.leaflet-touch .leaflet-control-attribution,\r
.leaflet-touch .leaflet-control-layers,\r
.leaflet-touch .leaflet-bar {\r
	box-shadow: none;\r
	}\r
.leaflet-touch .leaflet-control-layers,\r
.leaflet-touch .leaflet-bar {\r
	border: 2px solid rgba(0,0,0,0.2);\r
	background-clip: padding-box;\r
	}\r
\r
\r
/* popup */\r
\r
.leaflet-popup {\r
	position: absolute;\r
	text-align: center;\r
	margin-bottom: 20px;\r
	}\r
.leaflet-popup-content-wrapper {\r
	padding: 1px;\r
	text-align: left;\r
	border-radius: 12px;\r
	}\r
.leaflet-popup-content {\r
	margin: 13px 24px 13px 20px;\r
	line-height: 1.3;\r
	font-size: 13px;\r
	font-size: 1.08333em;\r
	min-height: 1px;\r
	}\r
.leaflet-popup-content p {\r
	margin: 17px 0;\r
	margin: 1.3em 0;\r
	}\r
.leaflet-popup-tip-container {\r
	width: 40px;\r
	height: 20px;\r
	position: absolute;\r
	left: 50%;\r
	margin-top: -1px;\r
	margin-left: -20px;\r
	overflow: hidden;\r
	pointer-events: none;\r
	}\r
.leaflet-popup-tip {\r

	height: 17px;\r
	padding: 1px;\r
\r
	margin: -10px auto 0;\r

\r
	-webkit-transform: rotate(45deg);\r
	   -moz-transform: rotate(45deg);\r
	    -ms-transform: rotate(45deg);\r
	        transform: rotate(45deg);\r
	}\r
.leaflet-popup-content-wrapper,\r
.leaflet-popup-tip {\r
	background: white;\r
	color: #333;\r
	box-shadow: 0 3px 14px rgba(0,0,0,0.4);\r
	}\r
.leaflet-container a.leaflet-popup-close-button {\r
	position: absolute;\r
	top: 0;\r
	right: 0;\r
	border: none;\r
	text-align: center;\r
	width: 24px;\r
	height: 24px;\r
	font: 16px/24px Tahoma, Verdana, sans-serif;\r
	color: #757575;\r
	text-decoration: none;\r
	background: transparent;\r
	}\r
.leaflet-container a.leaflet-popup-close-button:hover,\r
.leaflet-container a.leaflet-popup-close-button:focus {\r
	color: #585858;\r
	}\r
.leaflet-popup-scrolled {\r
	overflow: auto;\r
	}\r
\r
.leaflet-oldie .leaflet-popup-content-wrapper {\r
	-ms-zoom: 1;\r
	}\r
.leaflet-oldie .leaflet-popup-tip {\r
	width: 24px;\r
	margin: 0 auto;\r
\r
	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";\r
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);\r
	}\r
\r
.leaflet-oldie .leaflet-control-zoom,\r
.leaflet-oldie .leaflet-control-layers,\r
.leaflet-oldie .leaflet-popup-content-wrapper,\r
.leaflet-oldie .leaflet-popup-tip {\r
	border: 1px solid #999;\r
	}\r
\r
\r
/* div icon */\r
\r
.leaflet-div-icon {\r
	background: #fff;\r
	border: 1px solid #666;\r
	}\r
\r
\r
/* Tooltip */\r
/* Base styles for the element that has a tooltip */\r
.leaflet-tooltip {\r
	position: absolute;\r
	padding: 6px;\r
	background-color: #fff;\r

	}\r

	}\r
.leaflet-tooltip-top:before,\r
.leaflet-tooltip-bottom:before,\r
.leaflet-tooltip-left:before,\r
.leaflet-tooltip-right:before {\r
	position: absolute;\r
	pointer-events: none;\r
	border: 6px solid transparent;\r
	background: transparent;\r
	content: "";\r
	}\r
\r
/* Directions */\r
\r
.leaflet-tooltip-bottom {\r
	margin-top: 6px;\r
}\r
.leaflet-tooltip-top {\r
	margin-top: -6px;\r
}\r
.leaflet-tooltip-bottom:before,\r
.leaflet-tooltip-top:before {\r
	left: 50%;\r
	margin-left: -6px;\r
	}\r

	}\r
.leaflet-tooltip-bottom:before {\r
	top: 0;\r
	margin-top: -12px;\r
	margin-left: -6px;\r
	border-bottom-color: #fff;\r
	}\r
.leaflet-tooltip-left {\r
	margin-left: -6px;\r
}\r
.leaflet-tooltip-right {\r
	margin-left: 6px;\r
}\r
.leaflet-tooltip-left:before,\r
.leaflet-tooltip-right:before {\r
	top: 50%;\r
	margin-top: -6px;\r
	}\r
.leaflet-tooltip-left:before {\r
	right: 0;\r
	margin-right: -12px;\r
	border-left-color: #fff;\r
	}\r
.leaflet-tooltip-right:before {\r
	left: 0;\r
	margin-left: -12px;\r
	border-right-color: #fff;\r
	}\r
\r
/* Printing */\r
\r
@media print {\r
	/* Prevent printers from removing background-images of controls. */\r

	}\r
